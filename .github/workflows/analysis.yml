name: Run analysis on push

on:
  push:
    branches: [main, init/nanoporous-meta-analysis]
  pull_request:
    branches: [main, init/nanoporous-meta-analysis]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run exploratory analysis
        run: python notebooks/01_nanoporous_meta_analysis.py

      - name: Verify curated dataset present
        run: test -f data/processed/nanoporous_curated.csv

      - name: Commit regenerated figures if changed
        run: |
          git config user.name "Claude Code"
          git config user.email "noreply@anthropic.com"
          git add results/figures/
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "CI: regenerate analysis figures [skip ci]" -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
